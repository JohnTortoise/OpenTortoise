<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - Tortoise</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Toast Component -->
    <script src="/js/toast.js"></script>
    <style>
        /* Modern login page styles */
        body {
            background: white;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background shapes */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            animation: float 20s infinite ease-in-out;
        }
        
        .shape-1 {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape-2 {
            width: 150px;
            height: 150px;
            top: 70%;
            right: 10%;
            animation-delay: 5s;
        }
        
        .shape-3 {
            width: 100px;
            height: 100px;
            bottom: 10%;
            left: 30%;
            animation-delay: 10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            50% { transform: translateY(10px) rotate(180deg); }
            75% { transform: translateY(-10px) rotate(270deg); }
        }
        
        /* Login container glass effect */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.1);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.1);
        }
        
        /* Input field styles */
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(59, 130, 246, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem !important;
            color: #374151 !important;
        }

        .input-field:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            font-size: 1rem !important;
            color: #374151 !important;
        }

        .input-field::placeholder {
            color: #9ca3af !important;
            font-size: 1rem !important;
            font-weight: 400 !important;
        }
        
        /* Login button styles */
        .login-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .login-button:hover::before {
            left: 100%;
        }
        
        /* Logo styles */
        .logo-container {
            /* Removed animation and glow effect */
        }
        
        /* Checkbox custom style */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #3b82f6;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .custom-checkbox:checked {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: #3b82f6;
        }
        
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Animated background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    
    <!-- Main login container -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="login-container rounded-3xl overflow-hidden max-w-md w-full">
            <div class="p-8">
                <!-- Logo and title -->
                <div class="text-center mb-8">
                    <div class="logo-container inline-flex items-center justify-center mb-4">
                        <img src="/logo.png" alt="Tortoise" class="w-32 h-20 object-contain">
                    </div>
                    <p class="text-gray-700 text-lg">欢迎回来，请登录您的账户</p>
                </div>
                
                <!-- Login form -->
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-base font-semibold text-gray-700 mb-3">
                            <i class="fas fa-envelope mr-2" style="color: #3b82f6;"></i>邮箱地址
                        </label>
                        <input type="email" id="email" name="email" required
                               class="input-field block w-full px-6 py-5 rounded-xl focus:outline-none text-lg"
                               placeholder="your@email.com">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-base font-semibold text-gray-700 mb-3">
                            <i class="fas fa-lock mr-2" style="color: #3b82f6;"></i>密码
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                   class="input-field block w-full px-6 py-5 rounded-xl focus:outline-none pr-16 text-lg"
                                   placeholder="请输入密码">
                            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-600 transition text-lg">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="custom-checkbox">
                            <label for="remember-me" class="ml-4 text-base text-gray-700 cursor-pointer">
                                记住我
                            </label>
                        </div>
                        <a href="#" class="text-base font-medium text-blue-600 hover:text-blue-800 transition">
                            忘记密码？
                        </a>
                    </div>
                    
                    <button type="submit" id="loginBtn"
                            class="login-button w-full py-4 px-8 rounded-xl text-white font-semibold text-xl shadow-lg">
                        <span id="loginBtnText">立即登录</span>
                        <span id="loginBtnLoading" class="hidden">
                            <i class="fas fa-spinner fa-spin mr-3"></i>登录中...
                        </span>
                    </button>
                </form>
                
                <!-- Footer info -->
                <div class="mt-10 text-center text-base text-gray-600">
                    <p>© 2025 Tortoise. 保留所有权利。</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Enhanced login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Validation
            if (!email || !password) {
                showToast('请填写完整的登录信息', false);
                return;
            }
            
            if (!email.includes('@')) {
                showToast('请输入有效的邮箱地址', false);
                return;
            }
            
            // Show loading state
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginBtnLoading = document.getElementById('loginBtnLoading');
            
            loginBtn.disabled = true;
            loginBtnText.classList.add('hidden');
            loginBtnLoading.classList.remove('hidden');
            
            // Send login request
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('登录成功！正在跳转...', true);
                    
                    // Save token
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }

                    // Save user info
                    if (data.userInfo) {
                        localStorage.setItem('userInfo', JSON.stringify(data.userInfo));
                    }
                    
                    // Redirect after success
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    showToast(data.message || '登录失败，请检查邮箱和密码', false);
                    resetLoginButton();
                }
            })
            .catch(error => {
                showToast('网络连接异常，请稍后重试', false);
                resetLoginButton();
            });
        });
        
        // Reset login button state
        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginBtnLoading = document.getElementById('loginBtnLoading');
            
            loginBtn.disabled = false;
            loginBtnText.classList.remove('hidden');
            loginBtnLoading.classList.add('hidden');
        }
        
        // Add enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
