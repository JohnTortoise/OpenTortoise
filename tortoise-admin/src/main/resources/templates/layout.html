                       class="nav-item px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors"
                       data-page="conversations">
                        历史会话
                    </a>
                </div>
            </div>
            <!-- User Actions - Simplified Dropdown -->
            <div class="flex items-center pl-2">
                <div class="user-dropdown">
                    <button class="user-dropdown-btn" id="userDropdownBtn">
                        <div class="user-avatar email-avatar" id="userAvatar">
                            加载中...
                        </div>
                        <i class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
                    </button>
                    <div class="user-dropdown-menu" id="userDropdownMenu">
                        <a href="#" class="user-dropdown-item" id="user-profile-nav" data-page="user-profile">
                            <i class="fas fa-id-card"></i>
                            <span>个人信息</span>
                        </a>
                        <a href="#" class="user-dropdown-item hidden" id="user-management-nav" data-page="user-management">
                            <i class="fas fa-users-gear"></i>
                            <span>用户管理</span>
                        </a>
                        <div class="user-dropdown-divider"></div>
                        <button class="user-dropdown-item logout w-full text-left" id="logoutBtn">
                            <i class="fas fa-right-from-bracket"></i>
                            <span>退出登录</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="max-w-8xl mx-auto pt-8 pb-12 px-8">
    <!-- Page Content Containers -->
    <div id="llm-configs-page" class="page-container active-page">
        <div th:include="llm-configs :: content"></div>
    </div>

    <div id="conversations-page" class="page-container">
        <div th:include="conversations :: content"></div>
    </div>

    <div id="memory-strategy-page" class="page-container">
        <div th:include="memory-strategy :: content"></div>
    </div>
    
    <div id="chat-profile-page" class="page-container">
        <div th:include="chat-profile :: content"></div>
    </div>
    
    <div id="user-profile-page" class="page-container">
        <div th:include="user-profile :: content"></div>
    </div>
    
    <div id="user-management-page" class="page-container">
        <div th:include="user-management :: content"></div>
    </div>
</main>

<!-- Global Modals Container -->
<div id="modals-container">
    <!-- Modals will be dynamically loaded here -->
</div>

<!-- Logout Modal -->
<div id="logout-modal">
    <div class="logout-modal-content">
        <div class="logout-modal-body">
            <div class="logout-icon">
                <i class="fas fa-question-circle"></i>
            </div>
            <div class="logout-message">确定要退出登录吗？</div>
            <div class="logout-description">
                退出后，您将返回到登录页面，需要重新输入账号密码才能访问系统。
            </div>
            <div class="logout-actions">
                <button class="btn-logout-cancel" onclick="closeLogoutModal()">
                    <i class="fas fa-times mr-2"></i>
                    取消
                </button>
                <button class="btn-logout-confirm" onclick="confirmLogout()">
                    确认退出
                </button>
            </div>
        </div>
    </div>
</div>



<!-- JavaScript for page navigation and state management -->
<script th:inline="javascript">
    // 创建一个带认证的fetch函数
    function authenticatedFetch(url, options = {}) {
        // 获取存储的token
        const token = localStorage.getItem('token');

        // 设置默认选项
        const defaultOptions = {
            headers: {
                'Content-Type': 'application/json'
            }
        };

        // 合并选项
        const mergedOptions = {
            ...defaultOptions,
            ...options,
            headers: {
                ...defaultOptions.headers,
                ...options.headers
            }
        };

        // 如果有token，则添加Authorization头
        if (token) {
            mergedOptions.headers['Authorization'] = `Bearer ${token}`;
        }

        // 调用原生fetch
        return fetch(url, mergedOptions);
    }

    // 退出登录相关函数（全局作用域）
    function handleLogout() {
        // 显示自定义退出登录弹窗
        showLogoutModal();
    }

    function showLogoutModal() {
        const modal = document.getElementById('logout-modal');
        modal.classList.add('active');
        // 防止背景滚动
        document.body.style.overflow = 'hidden';

        // 添加ESC键监听
        document.addEventListener('keydown', handleEscKey);
        // 添加背景点击监听
        modal.addEventListener('click', handleBackgroundClick);
    }

    function closeLogoutModal() {
        const modal = document.getElementById('logout-modal');
        modal.classList.remove('active');
        // 恢复背景滚动
        document.body.style.overflow = '';

        // 移除事件监听
        document.removeEventListener('keydown', handleEscKey);
        modal.removeEventListener('click', handleBackgroundClick);
    }

    function handleEscKey(event) {
        if (event.key === 'Escape') {
            closeLogoutModal();
        }
    }

    function handleBackgroundClick(event) {
        if (event.target.id === 'logout-modal') {
            closeLogoutModal();
        }
    }

    function confirmLogout() {
        // 清除本地存储的token和用户信息
        localStorage.removeItem('token');
        localStorage.removeItem('userInfo');

        // 关闭弹窗
        closeLogoutModal();

        // 跳转到登录页面
        window.location.href = '/login';
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 立即加载用户信息
        loadUserInfo();

        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            // If no token, redirect to login page
            window.location.href = '/login';
            return;
        }

        // Check user role and show/hide management menu
        checkUserRole();

        // Page navigation handling
        const navItems = document.querySelectorAll('.nav-item[data-page]');
        const dropdownNavItems = document.querySelectorAll('.user-dropdown-item[data-page]');
        const pages = document.querySelectorAll('.page-container');

        // Set initial active page
        const initialPage = localStorage.getItem('tortoise-active-page') || 'llm-configs';
        switchPage(initialPage);

        // Handle main navigation items
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                switchPage(page);
                // Save current page to localStorage
                localStorage.setItem('tortoise-active-page', page);
            });
        });

        // Handle dropdown navigation items
        dropdownNavItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                switchPage(page);
                // Save current page to localStorage
                localStorage.setItem('tortoise-active-page', page);
                // Close dropdown after navigation
                userDropdownMenu.classList.remove('active');
                const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        });

        // User dropdown handling
        const userDropdownBtn = document.getElementById('userDropdownBtn');
        const userDropdownMenu = document.getElementById('userDropdownMenu');
        const logoutBtn = document.getElementById('logoutBtn');

        // Toggle dropdown menu with optimized event handling
        if (userDropdownBtn) {
            userDropdownBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                // Use requestAnimationFrame for smoother animation
                requestAnimationFrame(() => {
                    const isActive = userDropdownMenu.classList.contains('active');
                    userDropdownMenu.classList.toggle('active');

                    // Rotate chevron icon with hardware acceleration
                    const chevron = this.querySelector('.fa-chevron-down');
                    if (chevron) {
                        chevron.style.transform = isActive ? 'rotate(0deg)' : 'rotate(180deg)';
                    }
                });
            });
        }

        // Close dropdown when clicking outside with optimized performance
        let dropdownCloseHandler = null;
        function setupDropdownCloseHandler() {
            if (dropdownCloseHandler) {
                document.removeEventListener('click', dropdownCloseHandler);
            }
            dropdownCloseHandler = function(e) {
                if (!userDropdownBtn.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    requestAnimationFrame(() => {
                        userDropdownMenu.classList.remove('active');
                        const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                        if (chevron) {
                            chevron.style.transform = 'rotate(0deg)';
                        }
                    });
                }
            };
            document.addEventListener('click', dropdownCloseHandler);
        }
        setupDropdownCloseHandler();

        // Logout button handling
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                handleLogout();
                // Close dropdown after logout action
                userDropdownMenu.classList.remove('active');
                const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        }

        function switchPage(pageName) {
            // Get target elements first
            const activePage = document.getElementById(`${pageName}-page`);
            const targetNavItems = Array.from(navItems);
            const targetDropdownItems = Array.from(dropdownNavItems);
            const targetNavItem = targetNavItems.find(item => item.getAttribute('data-page') === pageName);
            const targetDropdownItem = targetDropdownItems.find(item => item.getAttribute('data-page') === pageName);
            const otherNavItems = targetNavItems.filter(item => item.getAttribute('data-page') !== pageName);
            const otherDropdownItems = targetDropdownItems.filter(item => item.getAttribute('data-page') !== pageName);

            // Simultaneously update everything in one batch
            const allPages = Array.from(pages);

            // Update everything at once - no time gaps
            // First set new states
            if (activePage) activePage.classList.add('active-page');
            if (targetNavItem) targetNavItem.classList.add('active');

            // Then remove old states
            allPages.forEach(page => {
                if (page !== activePage) page.classList.remove('active-page');
            });
            navItems.forEach(item => {
                if (item !== targetNavItem) item.classList.remove('active');
            });

            // Dispatch custom event for page load
            document.dispatchEvent(new CustomEvent('pageChanged', { detail: pageName }));

            // 加载用户信息
            loadUserInfo();
        }


        function checkUserRole() {
            // 获取用户信息以检查角色
            authenticatedFetch('/api/user/profile')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data) {
                        const roleCode = data.data.roleCode;
                        // SUPER_ADMIN的ID是1L
                        if (roleCode === 1) {
                            const managementNav = document.getElementById('user-management-nav');
                            if (managementNav) {
                                managementNav.classList.remove('hidden');
                            }
                        }
                    }
                })
                .catch(error => {
                    // Error checking user role
                });
        }

        // 加载和显示用户信息
        function loadUserInfo() {
            const userInfo = localStorage.getItem('userInfo');
            const userAvatar = document.getElementById('userAvatar');
            if (!userAvatar) return;

            if (userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    if (user.email) {
                        // 显示邮箱，使用纯文字样式
                        userAvatar.innerHTML = user.email;
                        userAvatar.classList.add('email-avatar');
                    } else {
                        userAvatar.innerHTML = '未登录';
                    }
                } catch (e) {
                    console.error('解析用户信息失败:', e);
                    userAvatar.innerHTML = '加载失败';
                }
            } else {
                userAvatar.innerHTML = '未登录';
            }
        }

    });
</script>
</body>
</html>
