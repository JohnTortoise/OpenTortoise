<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tortoise</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Toast Component -->
    <script src="/js/toast.js"></script>
    <!-- Pagination Component -->
    <script src="/js/pagination.js"></script>
    <style>
        .page-container {
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .active-page {
            display: block;
            opacity: 1;
        }
        /* 简化的导航项样式 */
        .nav-item {
            cursor: pointer;
        }

        /* 简化的导航激活状态 */
        .nav-item[data-page].active {
            color: #3b82f6;
            background-color: #dbeafe;
            font-weight: 600;
        }

        /* 导航下拉菜单样式 */
        .nav-dropdown {
            position: relative;
        }

        .nav-dropdown-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 1rem;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.8),
                0 20px 25px -5px rgba(59, 130, 246, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-width: 220px;
            padding: 0.75rem 0;
            margin-top: 0.5rem;
        }

        .nav-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .nav-dropdown-menu::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 1.5rem;
            width: 12px;
            height: 12px;
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border-left: 1px solid rgba(59, 130, 246, 0.1);
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            transform: rotate(45deg);
            border-radius: 2px 0 0 0;
            z-index: -1;
        }

        .nav-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1.25rem;
            color: #374151;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0.5rem;
            margin: 0.125rem 0.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .nav-dropdown-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(59, 130, 246, 0.08) 50%,
                transparent 100%);
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-dropdown-item:hover {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e40af;
            transform: translateX(3px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .nav-dropdown-item:hover::before {
            left: 100%;
        }

        .nav-dropdown-item i {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .nav-dropdown-item:hover i {
            color: #3b82f6;
            transform: scale(1.1);
        }

        .nav-dropdown-item span {
            flex: 1;
            line-height: 1.4;
        }

        .modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: block;
            opacity: 1;
        }
        .modal.hidden {
            display: none !important;
        }

        /* Grand animation effects */
        @keyframes slideInFromTop {
            from {
                transform: translateY(-100%) rotateX(-15deg);
                opacity: 0;
            }
            to {
                transform: translateY(0) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            }
            50% {
                box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
            }
        }

        /* Favicon Walking Animation - Enhanced Surprise Version */
        .favicon-walking {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            animation: walkAcrossPage 12s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            transform-origin: center;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.8));
        }

        .favicon-walking::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 2s ease-in-out infinite alternate;
            z-index: -1;
        }

        .favicon-walking::after {
            content: '🐢';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            animation: bounce 1s ease-in-out infinite;
            opacity: 0;
            animation-delay: 2s;
            animation-fill-mode: forwards;
        }

        @keyframes walkAcrossPage {
            0% {
                transform: translate(64px, 16px) scale(1) rotate(0deg);
                filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            }
            5% {
                transform: translate(15vw, 8vh) scale(1.05) rotate(2deg);
            }
            10% {
                transform: translate(25vw, 12vh) scale(0.95) rotate(-3deg);
                filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.7));
            }
            15% {
                transform: translate(35vw, 18vh) scale(1.1) rotate(5deg);
            }
            20% {
                transform: translate(45vw, 25vh) scale(0.9) rotate(-4deg);
            }
            25% {
                transform: translate(55vw, 32vh) scale(1.15) rotate(7deg);
                filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.9));
            }
            30% {
                transform: translate(65vw, 40vh) scale(0.85) rotate(-6deg);
            }
            35% {
                transform: translate(75vw, 48vh) scale(1.2) rotate(9deg);
            }
            40% {
                transform: translate(70vw, 56vh) scale(0.8) rotate(-8deg);
                filter: drop-shadow(0 0 25px rgba(59, 130, 246, 1));
            }
            45% {
                transform: translate(60vw, 64vh) scale(1.25) rotate(11deg);
            }
            50% {
                transform: translate(50vw, 72vh) scale(0.75) rotate(-10deg);
            }
            55% {
                transform: translate(40vw, 78vh) scale(1.3) rotate(13deg);
                filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8));
            }
            60% {
                transform: translate(30vw, 82vh) scale(0.7) rotate(-12deg);
            }
            65% {
                transform: translate(20vw, 85vh) scale(1.35) rotate(15deg);
            }
            70% {
                transform: translate(25vw, 86vh) scale(0.65) rotate(-14deg);
                filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.6));
            }
            75% {
                transform: translate(35vw, 87vh) scale(1.4) rotate(17deg);
            }
            80% {
                transform: translate(45vw, 88vh) scale(0.6) rotate(-16deg);
            }
            85% {
                transform: translate(55vw, 89vh) scale(1.45) rotate(19deg);
                filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.4));
            }
            90% {
                transform: translate(65vw, 90vh) scale(0.55) rotate(-18deg);
            }
            95% {
                transform: translate(75vw, 91vh) scale(1.5) rotate(21deg);
            }
            100% {
                transform: translate(85vw, 92vh) scale(0.5) rotate(-20deg);
                opacity: 0;
                filter: drop-shadow(0 0 50px rgba(59, 130, 246, 0.2));
            }
        }

        @keyframes glowPulse {
            0% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        @keyframes sparkleFade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(0.5);
            }
        }

        /* Page shake effect */
        .page-shaking {
            animation: pageShake 0.5s ease-in-out infinite;
        }

        @keyframes pageShake {
            0%, 100% {
                transform: translateX(0);
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-2px);
            }
            20%, 40%, 60%, 80% {
                transform: translateX(2px);
            }
        }

        /* 移除增强导航样式，使用简化样式 */
        
        /* Modern LLM Configs Page Styles */
        .config-header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            position: relative;

            border: 1px solid rgba(0, 0, 0, 0.05);

        .chat-config-header .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);

        .input-modern {

        /* 记忆策略页面紫色按钮样式 */

        /* 记忆策略页面特定样式 */

        /* 统一的搜索卡片和表单样式 - 使用蓝色主题 */

<script th:inline="javascript">
    // 处理TortoiseBaseResult响应格式的辅助函数
    function handleApiResponse(response) {
        return response.json().then(data => {
            // 检查响应格式是否为TortoiseBaseResult
            if (data.hasOwnProperty('code')) {
                // 当code是500时，显示toast提示msg
                if (data.code === 500 || data.code !== 200) {
                    const errorMsg = data.msg || '操作失败';
                    showToast(errorMsg, false);
                    // 返回一个拒绝的Promise，以便后续catch可以处理
                    return Promise.reject(new Error(errorMsg));
                }
                // 当code是200时，返回data中的数据
                if (data.code === 200) {
                    return data.data;
                }
            }
            // 如果不是TortoiseBaseResult格式，返回原始数据（兼容旧代码）
            return data;
        });
    }

    // 创建一个带认证的fetch函数
    function authenticatedFetch(url, options = {}) {
        // 获取存储的token
        const token = localStorage.getItem('token');

        // 设置默认选项
        const defaultOptions = {
            headers: {
                'Content-Type': 'application/json'
            }
        };

        // 合并选项
        const mergedOptions = {
            ...defaultOptions,
            ...options,
            headers: {
                ...defaultOptions.headers,
                ...options.headers
            }
        };

        // 如果有token，则添加Authorization头
        if (token) {
            mergedOptions.headers['Authorization'] = `Bearer ${token}`;
        }

        // 调用原生fetch
        return fetch(url, mergedOptions).then(response => {
            if (!response.ok) {
                return response.json().then(data => {
                    // 处理HTTP错误状态码，但尝试解析TortoiseBaseResult格式
                    if (data && data.hasOwnProperty('code') && data.code === 500) {
                        const errorMsg = data.msg || '操作失败';
                        showToast(errorMsg, false);
                        return Promise.reject(new Error(errorMsg));
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }).catch(err => {
                    throw new Error(`HTTP error! status: ${response.status}`);
                });
            }
            return response;
        });
    }

    // 通用的下拉菜单显示/隐藏函数（支持元素对象和ID字符串）
    function showDropdown(dropdown) {
        // 如果传入的是字符串，则通过ID获取元素
        const dropdownElement = typeof dropdown === 'string' ? document.getElementById(dropdown) : dropdown;
        if (dropdownElement) {
            dropdownElement.style.display = 'block';
            dropdownElement.style.visibility = 'visible';
            // 使用requestAnimationFrame确保DOM更新后再应用动画
            requestAnimationFrame(() => {
                dropdownElement.style.opacity = '1';
                dropdownElement.style.transform = 'translateY(0)';
            });
        }
    }

    function hideDropdown(dropdown) {
        // 如果传入的是字符串，则通过ID获取元素
        const dropdownElement = typeof dropdown === 'string' ? document.getElementById(dropdown) : dropdown;
        if (dropdownElement) {
            dropdownElement.style.opacity = '0';
            dropdownElement.style.transform = 'translateY(-5px)';
            setTimeout(() => {
                dropdownElement.style.display = 'none';
                dropdownElement.style.visibility = 'hidden';
            }, 200);
        }
    }

    // 退出登录相关函数（全局作用域）
    function handleLogout() {
        // 显示自定义退出登录弹窗
        showLogoutModal();
    }

    function showLogoutModal() {
        const modal = document.getElementById('logout-modal');
        modal.classList.add('active');
        // 防止背景滚动
        document.body.style.overflow = 'hidden';

        // 添加ESC键监听
        document.addEventListener('keydown', handleEscKey);
        // 添加背景点击监听
        modal.addEventListener('click', handleBackgroundClick);
    }

    function closeLogoutModal() {
        const modal = document.getElementById('logout-modal');
        modal.classList.remove('active');
        // 恢复背景滚动
        document.body.style.overflow = '';

        // 移除事件监听
        document.removeEventListener('keydown', handleEscKey);
        modal.removeEventListener('click', handleBackgroundClick);
    }

    function handleEscKey(event) {
        if (event.key === 'Escape') {
            closeLogoutModal();
        }
    }

    function handleBackgroundClick(event) {
        if (event.target.id === 'logout-modal') {
            closeLogoutModal();
        }
    }

    function confirmLogout() {
        // 清除本地存储的token和用户信息
        localStorage.removeItem('token');
        localStorage.removeItem('userInfo');

        // 关闭弹窗
        closeLogoutModal();

        // 跳转到登录页面
        window.location.href = '/login';
    }

    // Favicon walking animation function - Enhanced Surprise Version
    function startFaviconWalking() {
        // Remove any existing walking favicon
        const existingWalking = document.querySelector('.favicon-walking');
        if (existingWalking) {
            existingWalking.remove();
        }

        // Create a clone of the logo for animation
        const logo = document.querySelector('nav img[alt="Tortoise"]');
        if (!logo) return;

        const walkingFavicon = logo.cloneNode(true);
        walkingFavicon.classList.add('favicon-walking');
        walkingFavicon.style.width = '64px';
        walkingFavicon.style.height = '40px';

        // Add sparkle trail effect
        createSparkleTrail(walkingFavicon);

        // Add to body
        document.body.appendChild(walkingFavicon);

        // Add page shake effect during animation
        addPageShake();

        // Remove after animation completes
        setTimeout(() => {
            if (walkingFavicon.parentNode) {
                walkingFavicon.parentNode.removeChild(walkingFavicon);
            }
            // Clean up sparkle trail
            const sparkles = document.querySelectorAll('.sparkle-trail');
            sparkles.forEach(sparkle => sparkle.remove());
            // Remove page shake
            document.body.classList.remove('page-shaking');
        }, 12500); // Slightly longer than animation duration
    }

    // Create sparkle trail effect
    function createSparkleTrail(favicon) {
        let sparkleCount = 0;
        const maxSparkles = 50;

        const sparkleInterval = setInterval(() => {
            if (sparkleCount >= maxSparkles) {
                clearInterval(sparkleInterval);
                return;
            }

            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-trail';
            sparkle.style.cssText = `
                position: fixed;
                width: 4px;
                height: 4px;
                background: radial-gradient(circle, #60a5fa, #3b82f6, transparent);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                animation: sparkleFade 2s ease-out forwards;
                top: ${favicon.offsetTop + 20}px;
                left: ${favicon.offsetLeft + 32}px;
            `;

            document.body.appendChild(sparkle);
            sparkleCount++;

            // Remove sparkle after animation
            setTimeout(() => {
                if (sparkle.parentNode) {
                    sparkle.parentNode.removeChild(sparkle);
                }
            }, 2000);
        }, 200);
    }

    // Add page shake effect
    function addPageShake() {
        document.body.classList.add('page-shaking');
        setTimeout(() => {
            document.body.classList.remove('page-shaking');
        }, 12000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Add click handler to logo
        const logo = document.querySelector('nav img[alt="Tortoise"]');
        if (logo) {
            logo.style.cursor = 'pointer';
            logo.addEventListener('click', function(e) {
                e.preventDefault();
                startFaviconWalking();
            });
        }

        // 立即加载用户信息
        loadUserInfo();

        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            // If no token, redirect to login page
            window.location.href = '/login';
            return;
        }

        // Check user role and show/hide management menu
        checkUserRole();

        // Page navigation handling
        const navItems = document.querySelectorAll('.nav-item[data-page]');
        const dropdownNavItems = document.querySelectorAll('.user-dropdown-item[data-page]');
        const pages = document.querySelectorAll('.page-container');

        // Set initial active page
        const initialPage = localStorage.getItem('tortoise-active-page') || 'llm-configs';
        switchPage(initialPage);

        // Handle main navigation items
        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                switchPage(page);
                // Save current page to localStorage
                localStorage.setItem('tortoise-active-page', page);
            });
        });

        // Handle dropdown navigation items
        dropdownNavItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                switchPage(page);
                // Save current page to localStorage
                localStorage.setItem('tortoise-active-page', page);
                // Close dropdown after navigation
                userDropdownMenu.classList.remove('active');
                const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        });

        // Configuration dropdown handling
        const configDropdownBtn = document.getElementById('configDropdownBtn');
        const configDropdownMenu = document.getElementById('configDropdownMenu');

        // Toggle config dropdown menu
        if (configDropdownBtn) {
            configDropdownBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                // Use requestAnimationFrame for smoother animation
                requestAnimationFrame(() => {
                    const isActive = configDropdownMenu.classList.contains('active');
                    configDropdownMenu.classList.toggle('active');

                    // Rotate chevron icon with hardware acceleration
                    const chevron = this.querySelector('.fa-chevron-down');
                    if (chevron) {
                        chevron.style.transform = isActive ? 'rotate(0deg)' : 'rotate(180deg)';
                    }
                });
            });
        }

        // Handle config dropdown navigation items
        const configDropdownItems = document.querySelectorAll('.nav-dropdown-item[data-page]');
        configDropdownItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                switchPage(page);
                // Save current page to localStorage
                localStorage.setItem('tortoise-active-page', page);
                // Close dropdown after navigation
                configDropdownMenu.classList.remove('active');
                const chevron = configDropdownBtn.querySelector('.fa-chevron-down');
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        });

        // User dropdown handling
        const userDropdownBtn = document.getElementById('userDropdownBtn');
        const userDropdownMenu = document.getElementById('userDropdownMenu');
        const logoutBtn = document.getElementById('logoutBtn');

        // Toggle dropdown menu with optimized event handling
        if (userDropdownBtn) {
            userDropdownBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                // Use requestAnimationFrame for smoother animation
                requestAnimationFrame(() => {
                    const isActive = userDropdownMenu.classList.contains('active');
                    userDropdownMenu.classList.toggle('active');

                    // Rotate chevron icon with hardware acceleration
                    const chevron = this.querySelector('.fa-chevron-down');
                    if (chevron) {
                        chevron.style.transform = isActive ? 'rotate(0deg)' : 'rotate(180deg)';
                    }
                });
            });
        }

        // Close dropdown when clicking outside with optimized performance
        let dropdownCloseHandler = null;
        function setupDropdownCloseHandler() {
            if (dropdownCloseHandler) {
                document.removeEventListener('click', dropdownCloseHandler);
            }
            dropdownCloseHandler = function(e) {
                // Close config dropdown if clicked outside
                if (configDropdownBtn && configDropdownMenu &&
                    !configDropdownBtn.contains(e.target) && !configDropdownMenu.contains(e.target)) {
                    requestAnimationFrame(() => {
                        configDropdownMenu.classList.remove('active');
                        const chevron = configDropdownBtn.querySelector('.fa-chevron-down');
                        if (chevron) {
                            chevron.style.transform = 'rotate(0deg)';
                        }
                    });
                }

                // Close user dropdown if clicked outside
                if (!userDropdownBtn.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    requestAnimationFrame(() => {
                        userDropdownMenu.classList.remove('active');
                        const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                        if (chevron) {
                            chevron.style.transform = 'rotate(0deg)';
                        }
                    });
                }
            };
            document.addEventListener('click', dropdownCloseHandler);
        }
        setupDropdownCloseHandler();

        // Logout button handling
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                confirmLogout();
                // Close dropdown after logout action
                userDropdownMenu.classList.remove('active');
                const chevron = userDropdownBtn.querySelector('.fa-chevron-down');
                if (chevron) {
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        }

        function switchPage(pageName) {
            // Get elements dynamically to avoid dependency on local variables
            const activePage = document.getElementById(`${pageName}-page`);
            const allNavItems = document.querySelectorAll('.nav-item[data-page]');
            const allDropdownItems = document.querySelectorAll('.user-dropdown-item[data-page]');
            const allPages = document.querySelectorAll('.page-container');

            const targetNavItem = Array.from(allNavItems).find(item => item.getAttribute('data-page') === pageName);
            const targetDropdownItem = Array.from(allDropdownItems).find(item => item.getAttribute('data-page') === pageName);

            // Update everything at once - no time gaps
            // First set new states
            if (activePage) activePage.classList.add('active-page');
            if (targetNavItem) targetNavItem.classList.add('active');

            // Then remove old states
            allPages.forEach(page => {
                if (page !== activePage) page.classList.remove('active-page');
            });
            allNavItems.forEach(item => {
                if (item !== targetNavItem) item.classList.remove('active');
            });

            // Dispatch custom event for page load
            document.dispatchEvent(new CustomEvent('pageChanged', { detail: pageName }));

            // 加载用户信息
            loadUserInfo();
        }

        // Export switchPage function to global scope for use in other pages
        window.switchPage = switchPage;


        function checkUserRole() {
            // 获取用户信息以检查角色
            authenticatedFetch('/api/user/profile')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 处理TortoiseBaseResult格式
                    let actualData = data;
                    if (data && data.hasOwnProperty('code')) {
                        if (data.code === 200) {
                            actualData = data.data;
                        } else {
                            // code不是200，错误已在handleApiResponse中处理
                            return;
                        }
                    }
                    
                    // 兼容旧格式或处理数据
                    const userData = actualData.data || actualData;
                    if (userData && userData.roleCode !== undefined) {
                        const roleCode = userData.roleCode;
                        // SUPER_ADMIN的ID是1L
                        if (roleCode === 1) {
                            const managementNav = document.getElementById('user-management-nav');
                            if (managementNav) {
                                managementNav.classList.remove('hidden');
                            }
                        }
                    }
                })
                .catch(error => {
                    // Error checking user role - 错误消息已在handleApiResponse中显示
                });
        }

        // 加载和显示用户信息
        function loadUserInfo() {
            const userInfo = localStorage.getItem('userInfo');
            const userAvatar = document.getElementById('userAvatar');
            if (!userAvatar) return;

            if (userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    if (user.email) {
                        // 显示邮箱，使用纯文字样式
                        userAvatar.innerHTML = user.email;
                        userAvatar.classList.add('email-avatar');
                    } else {
                        userAvatar.innerHTML = '未登录';
                    }
                } catch (e) {
                    console.error('解析用户信息失败:', e);
                    userAvatar.innerHTML = '加载失败';
                }
            } else {
                userAvatar.innerHTML = '未登录';
            }
        }

    });
</script>
