<div th:fragment="content">
    <div class="px-4 py-6 sm:px-0">
        <!-- Page Header -->
        <div class="config-header relative">
            <div class="relative z-10">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <h1 class="text-3xl font-bold mb-2 flex items-center gap-3">
                            <i class="fas fa-users-cog text-2xl"></i>
                            用户管理
                        </h1>
                        <p class="text-blue-100">管理系统用户（仅管理员）</p>
                    </div>
                    <button id="add-user-btn" 
                            class="mt-4 sm:mt-0 btn-primary px-6 py-3 rounded-lg text-white font-medium shadow-lg">
                        <i class="fas fa-plus mr-2"></i>
                        新增用户
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Search Form -->
        <div class="config-card search-card p-6 mb-6">
            <h3 class="form-title">
                <i class="fas fa-search text-blue-600"></i>
                搜索用户
            </h3>
            <form id="user-search-form" class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div>
                    <label for="email-search" class="block text-sm font-semibold text-gray-700 mb-2">邮箱</label>
                    <input type="text" id="email-search" name="email" 
                           class="input-modern w-full"
                           placeholder="请输入邮箱">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                            class="w-full btn-primary py-3 px-6 rounded-lg text-white font-medium shadow-lg">
                        <i class="fas fa-search mr-2"></i>搜索
                    </button>
                </div>
            </form>
        </div>
        
        <!-- User Table -->
        <div class="config-card table-modern">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">邮箱</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">角色</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">创建时间</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">更新时间</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center">
                                <div class="empty-state">
                                    <div class="empty-state-icon">
                                        <i class="fas fa-spinner fa-spin"></i>
                                    </div>
                                    <p class="text-lg font-medium text-gray-600">加载中...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div id="users-pagination-container" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                <!-- Pagination will be populated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal-modern fixed inset-0 z-50 overflow-y-auto hidden">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" aria-hidden="true"></div>
            
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            
            <div class="modal-content inline-block align-bottom text-left overflow-hidden transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full max-h-[90vh] overflow-y-auto">
                <div class="bg-white px-6 py-4">
                    <form id="user-form">
                        <input type="hidden" id="user-form-id">
                        
                        <div class="space-y-4">
                            <div>
                                <label for="user-form-email" class="block text-sm font-semibold text-gray-700 mb-2">
                                    邮箱 <span class="text-red-500">*</span>
                                </label>
                                <input type="email" id="user-form-email" required
                                       class="input-modern w-full"
                                       placeholder="请输入邮箱">
                            </div>
                            
                            <div>
                                <label for="user-form-password" class="block text-sm font-semibold text-gray-700 mb-2">
                                    密码 <span class="text-red-500">*</span>
                                </label>
                                <input type="password" id="user-form-password"
                                       class="input-modern w-full"
                                       placeholder="请输入密码">
                                <span class="text-xs text-gray-500 mt-1">编辑时留空则不修改密码</span>
                            </div>
                            
                            <div>
                                <label for="user-form-role" class="block text-sm font-semibold text-gray-700 mb-2">
                                    角色 <span class="text-red-500">*</span>
                                </label>
                                <div class="relative mt-1">
                                    <input type="text" id="user-form-role-input"
                                           placeholder="请选择角色"
                                           class="input-modern w-full cursor-pointer"
                                           readonly>
                                    <div id="user-form-role-dropdown"
                                         class="absolute z-50 mt-1 w-full bg-white shadow-xl rounded-lg py-2 text-sm border border-gray-200 focus:outline-none hidden hide-scrollbar"
                                         style="box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);">
                                        <div class="search-dropdown-item" data-value="0">消费者</div>
                                        <div class="search-dropdown-item" data-value="1">超级管理员</div>
                                        <div class="search-dropdown-item" data-value="2">开发</div>
                                        <div class="search-dropdown-item" data-value="3">测试</div>
                                        <div class="search-dropdown-item" data-value="4">产品</div>
                                        <div class="search-dropdown-item" data-value="5">运营</div>
                                    </div>
                                </div>
                                <input type="hidden" id="user-form-role" required>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="bg-gray-50 px-6 py-4 sm:px-6 sm:flex sm:flex-row-reverse gap-3">
                    <button type="button" id="save-user-btn"
                            class="btn-primary px-6 py-3 rounded-lg text-white font-medium shadow-lg">
                        保存
                    </button>
                    <button type="button" id="cancel-user-btn"
                            class="px-6 py-3 rounded-lg border border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-50 transition">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        (function() {
            let currentSearch = {
                email: ''
            };
            let isPageActive = false;
            let currentPage = 1;
            let isEditMode = false;
            let initialized = false;
            
            let searchForm, usersTableBody, usersPaginationContainer, addUserBtn, userModal;
            let userForm, saveUserBtn, cancelUserBtn;
            
            function initElements() {
                // 检查元素是否存在
                if (!searchForm) searchForm = document.getElementById('user-search-form');
                if (!usersTableBody) usersTableBody = document.getElementById('users-table-body');
                if (!usersPaginationContainer) usersPaginationContainer = document.getElementById('users-pagination-container');
                if (!addUserBtn) addUserBtn = document.getElementById('add-user-btn');
                if (!userModal) userModal = document.getElementById('user-modal');
                if (!userForm) userForm = document.getElementById('user-form');
                if (!saveUserBtn) saveUserBtn = document.getElementById('save-user-btn');
                if (!cancelUserBtn) cancelUserBtn = document.getElementById('cancel-user-btn');

                // 只有当元素存在且未初始化时才绑定事件
                if (searchForm && !initialized) {
                    searchForm.addEventListener('submit', handleSearch);

                    if (addUserBtn) {
                        addUserBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            openAddModal();
                        });
                    }

                    if (saveUserBtn) saveUserBtn.addEventListener('click', saveUser);
                    if (cancelUserBtn) cancelUserBtn.addEventListener('click', closeUserModal);

                    initialized = true;
                }

            }
            
            // 初始化函数
            function doInit() {
                initElements();
                setupRoleDropdown();
                const pageElement = document.getElementById('user-management-page');
                if (pageElement && pageElement.classList.contains('active-page')) {
                    isPageActive = true;
                    loadUsers(1);
                }
            }

            // 页面加载完成后初始化
            document.addEventListener('DOMContentLoaded', doInit);
            
            // 页面切换时也尝试初始化
            document.addEventListener('pageChanged', function(e) {
                if (e.detail === 'user-management') {
                    // 重置初始化状态，允许重新绑定事件
                    initialized = false;
                    doInit();
                } else {
                    isPageActive = false;
                }
            });
            
            function handleSearch(e) {
                try {
                    e.preventDefault();
                    console.log('搜索开始');

                    const emailInput = document.getElementById('email-search');
                    if (!emailInput) {
                        console.error('找不到邮箱搜索输入框');
                        return;
                    }

                    currentSearch.email = emailInput.value.trim();
                    console.log('搜索邮箱:', currentSearch.email);

                    currentPage = 1;
                    console.log('即将调用 loadUsers，页码:', currentPage);
                    loadUsers(currentPage);
                } catch (error) {
                    console.error('搜索过程中发生错误:', error);
                }
            }
            
            function loadUsers(page) {
                currentPage = page;
                console.log('加载用户列表，页码:', page, '搜索邮箱:', currentSearch.email);

                // 确保元素存在
                if (!usersTableBody) {
                    usersTableBody = document.getElementById('users-table-body');
                }

                if (!usersTableBody) {
                    console.error('找不到用户表格元素');
                    return;
                }

                usersTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center">
                            <div class="empty-state">
                                <div class="empty-state-icon">
                                    <i class="fas fa-spinner fa-spin"></i>
                                </div>
                                <p class="text-lg font-medium text-gray-600">加载中...</p>
                            </div>
                        </td>
                    </tr>
                `;

                const params = new URLSearchParams({
                    current: page,
                    size: 10
                });

                if (currentSearch.email) {
                    params.append('email', currentSearch.email);
                }

                console.log('调用接口:', `/api/user/list?${params.toString()}`);
                authenticatedFetch(`/api/user/list?${params.toString()}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 处理TortoiseBaseResult格式
                        let actualData = data;
                        if (data && data.hasOwnProperty('code')) {
                            if (data.code === 200) {
                                actualData = data.data;
                            } else {
                                // code不是200，错误已在handleApiResponse中处理
                                throw new Error(data.msg || '加载用户列表失败');
                            }
                        }
                        
                        // 兼容旧格式或处理数据
                        if (actualData && (actualData.records || actualData.data)) {
                            const pageData = actualData.records ? actualData : actualData.data;
                            renderUsersTable(pageData);
                            renderPagination(pageData);
                        } else {
                            // 数据为空或格式不正确
                            if (usersTableBody) {
                                usersTableBody.innerHTML = `
                                    <tr>
                                        <td colspan="6" class="px-6 py-8 text-center">
                                            <div class="empty-state">
                                                <p class="text-lg font-medium text-gray-600">暂无数据</p>
                                            </div>
                                        </td>
                                    </tr>
                                `;
                            }
                        }
                    })
                    .catch(error => {
                        // 错误消息已在handleApiResponse中显示toast，这里只处理UI
                        if (usersTableBody) {
                            usersTableBody.innerHTML = `
                                <tr>
                                    <td colspan="6" class="px-6 py-8 text-center">
                                        <div class="empty-state">
                                            <p class="text-lg font-medium text-gray-600">加载失败，请刷新页面重试</p>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }
                        if (usersPaginationContainer) {
                            usersPaginationContainer.innerHTML = '';
                        }
                    });
            }
            
            function renderUsersTable(pageData) {
                if (!usersTableBody) {
                    usersTableBody = document.getElementById('users-table-body');
                }

                if (!usersTableBody) {
                    return;
                }

                // 确保事件委托已正确绑定
                ensureEventDelegation();
                
                if (!pageData || !pageData.records || pageData.records.length === 0) {
                    usersTableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center">
                                <div class="empty-state">
                                    <p class="text-lg font-medium text-gray-600">暂无数据</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                // 转义用户邮箱，防止XSS攻击
                const escapeHtml = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                };
                
                usersTableBody.innerHTML = pageData.records.map(user => {
                    const email = escapeHtml(user.email || '');
                    const roleName = escapeHtml(user.roleName || '');
                    return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${user.id || ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${email}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${roleName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.createTime || ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.updateTime || ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button class="edit-user-btn text-blue-600 hover:text-blue-900 mr-3"
                                    data-user-id="${user.id}"
                                    data-user-email="${email.replace(/"/g, '&quot;')}"
                                    data-user-role="${user.roleCode || 0}">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="delete-user-btn text-red-600 hover:text-red-900"
                                    data-user-id="${user.id}">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </td>
                    </tr>
                `;
                }).join('');
            }
            
            function renderPagination(pageData) {
                if (!usersPaginationContainer) {
                    usersPaginationContainer = document.getElementById('users-pagination-container');
                }
                
                if (!usersPaginationContainer) {
                    return;
                }
                
                if (!pageData || !pageData.pages || pageData.pages <= 1) {
                    usersPaginationContainer.innerHTML = '';
                    return;
                }
                
                let paginationHTML = '<div class="flex items-center justify-between">';
                paginationHTML += `<div class="text-sm text-gray-700">共 ${pageData.total || 0} 条记录，第 ${pageData.current || 1} / ${pageData.pages} 页</div>`;
                paginationHTML += '<div class="flex gap-2">';
                
                if (pageData.current > 1) {
                    paginationHTML += `<button onclick="loadUsers(${pageData.current - 1})" class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-700 hover:bg-gray-50">上一页</button>`;
                }
                
                for (let i = Math.max(1, pageData.current - 2); i <= Math.min(pageData.pages, pageData.current + 2); i++) {
                    if (i === pageData.current) {
                        paginationHTML += `<button class="px-4 py-2 border border-blue-500 rounded-md bg-blue-50 text-blue-700 font-medium">${i}</button>`;
                    } else {
                        paginationHTML += `<button onclick="loadUsers(${i})" class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-700 hover:bg-gray-50">${i}</button>`;
                    }
                }
                
                if (pageData.current < pageData.pages) {
                    paginationHTML += `<button onclick="loadUsers(${pageData.current + 1})" class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-700 hover:bg-gray-50">下一页</button>`;
                }
                
                paginationHTML += '</div></div>';
                usersPaginationContainer.innerHTML = paginationHTML;
            }
            
            function openAddModal() {
                // 确保元素已初始化
                initElements();
                
                // 如果元素不存在，尝试重新获取
                if (!userModal) {
                    userModal = document.getElementById('user-modal');
                }
                if (!userForm) {
                    userForm = document.getElementById('user-form');
                }
                
                if (!userModal || !userForm) {
                    alert('无法打开弹窗，请刷新页面重试');
                    return;
                }

                isEditMode = false;
                userForm.reset();
                const formId = document.getElementById('user-form-id');
                if (formId) formId.value = '';

                // 重置角色下拉框
                document.getElementById('user-form-role-input').value = '';
                document.getElementById('user-form-role').value = '';

                const formPassword = document.getElementById('user-form-password');
                if (formPassword) {
                    formPassword.value = '';
                    formPassword.required = true;
                }
                
                // 显示模态框
                userModal.classList.remove('hidden');
                userModal.classList.add('active');
                userModal.style.display = 'block';
                userModal.style.opacity = '1';

                // 防止背景滚动
                document.body.style.overflow = 'hidden';
            }
            
            function setupRoleDropdown() {
                const roleInput = document.getElementById('user-form-role-input');
                const roleDropdown = document.getElementById('user-form-role-dropdown');
                const roleHidden = document.getElementById('user-form-role');

                // 初始化默认值（空）
                roleInput.value = '';
                roleHidden.value = '';

                // 输入框点击时显示下拉菜单
                roleInput.onclick = function() {
                    showDropdown(roleDropdown);
                };

                // 点击其他地方关闭下拉
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('#user-form-role-input') && !e.target.closest('#user-form-role-dropdown')) {
                        hideDropdown(roleDropdown);
                    }
                });

                // 处理下拉选项点击
                roleDropdown.addEventListener('click', function(e) {
                    const item = e.target.closest('.search-dropdown-item');
                    if (item) {
                        const value = item.getAttribute('data-value');
                        const text = item.textContent;

                        roleInput.value = text;
                        roleHidden.value = value;
                        hideDropdown(roleDropdown);
                    }
                });
            }

            // showDropdown 和 hideDropdown 函数已在 layout.html 中定义，这里移除重复定义

            function editUser(id, email, roleCode) {
                initElements(); // 确保元素已初始化
                if (!userModal || !userForm) {
                    return;
                }
                isEditMode = true;
                const formId = document.getElementById('user-form-id');
                if (formId) formId.value = id;
                const formEmail = document.getElementById('user-form-email');
                if (formEmail) formEmail.value = email;

                // 设置角色下拉框的值和显示文本
                const roleText = getRoleText(roleCode);
                document.getElementById('user-form-role-input').value = roleText;
                document.getElementById('user-form-role').value = roleCode;

                const formPassword = document.getElementById('user-form-password');
                if (formPassword) {
                    formPassword.value = '';
                    formPassword.required = false;
                }

                // 显示模态框 - 与 openAddModal 保持一致
                userModal.classList.remove('hidden');
                userModal.classList.add('active');
                userModal.style.display = 'block';
                userModal.style.opacity = '1';

                // 防止背景滚动
                document.body.style.overflow = 'hidden';
            }

            // 获取角色文本的辅助函数
            function getRoleText(roleCode) {
                const roleMap = {
                    '0': '消费者',
                    '1': '超级管理员',
                    '2': '开发',
                    '3': '测试',
                    '4': '产品',
                    '5': '运营'
                };
                return roleMap[roleCode] || '未知角色';
            }
            
            function deleteUser(userId) {
                if (!confirm('确定要删除此用户吗？')) {
                    return;
                }
                
                const params = new URLSearchParams({ userId: userId });
                authenticatedFetch(`/api/user/delete?${params.toString()}`, {
                    method: 'POST'
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 处理TortoiseBaseResult格式
                        if (data && data.hasOwnProperty('code')) {
                            if (data.code === 200) {
                                showToast(data.msg || '删除成功', true);
                                loadUsers(currentPage);
                            } else {
                                // code不是200，错误已在handleApiResponse中处理，但这里也要显示成功消息
                                if (data.code !== 500) {
                                    showToast(data.msg || '删除成功', true);
                                    loadUsers(currentPage);
                                }
                            }
                        } else {
                            // 兼容旧格式
                            if (data.success) {
                                showToast('删除成功', true);
                                loadUsers(currentPage);
                            } else {
                                showToast(data.message || '删除失败', false);
                            }
                        }
                    })
                    .catch(error => {
                        // 错误消息已在handleApiResponse中显示toast，这里不再重复
                        if (!error.message || error.message.includes('HTTP')) {
                            showToast('删除失败，请稍后重试', false);
                        }
                    });
            };
            
            function saveUser() {
                const id = document.getElementById('user-form-id').value;
                const email = document.getElementById('user-form-email').value;
                const password = document.getElementById('user-form-password').value;
                const roleId = document.getElementById('user-form-role').value;
                
                if (!email || !roleId) {
                    showToast('请填写必填项', false);
                    return;
                }
                
                if (!isEditMode && !password) {
                    showToast('新增用户时密码不能为空', false);
                    return;
                }
                
                let data;
                if (isEditMode) {
                    // 更新用户
                    data = {
                        id: parseInt(id),
                        email: email,
                        roleId: parseInt(roleId)
                    };
                    if (password) {
                        data.password = password;
                    }
                } else {
                    // 创建用户
                    data = {
                        email: email,
                        password: password,
                        roleId: parseInt(roleId)
                    };
                }
                
                saveUserBtn.disabled = true;
                saveUserBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>保存中...';
                
                const url = isEditMode ? '/api/user/update' : '/api/user/create';
                
                authenticatedFetch(url, {
                    method: 'POST',
                    body: JSON.stringify(data)
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('HTTP error! status: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 处理TortoiseBaseResult格式
                        if (data && data.hasOwnProperty('code')) {
                            if (data.code === 200) {
                                showToast(data.msg || '保存成功', true);
                                // 延迟关闭弹窗，让toast有时间显示
                                setTimeout(() => {
                                    closeUserModal();
                                    loadUsers(currentPage);
                                }, 300);
                            } else {
                                // code不是200，错误已在handleApiResponse中处理
                                // 但如果code不是500，可能也是成功的
                                if (data.code !== 500) {
                                    showToast(data.msg || '保存成功', true);
                                    setTimeout(() => {
                                        closeUserModal();
                                        loadUsers(currentPage);
                                    }, 300);
                                }
                            }
                        } else {
                            // 兼容旧格式
                            if (data.success) {
                                showToast(data.message || '保存成功', true);
                                // 延迟关闭弹窗，让toast有时间显示
                                setTimeout(() => {
                                    closeUserModal();
                                    loadUsers(currentPage);
                                }, 300);
                            } else {
                                showToast(data.message || '保存失败', false);
                            }
                        }
                    })
                    .catch(error => {
                        // 错误消息已在handleApiResponse中显示toast，这里不再重复
                        if (!error.message || error.message.includes('HTTP')) {
                            showToast('保存失败，请稍后重试', false);
                        }
                    })
                    .finally(() => {
                        saveUserBtn.disabled = false;
                        saveUserBtn.innerHTML = '<i class="fas fa-save mr-2"></i>保存';
                    });
            }
            
            function closeUserModal() {
                if (userModal) {
                    userModal.classList.add('hidden');
                    userModal.classList.remove('active');
                    userModal.style.display = 'none';
                    userModal.style.opacity = '0';
                }
                if (userForm) userForm.reset();
                isEditMode = false;
                // 恢复背景滚动
                document.body.style.overflow = '';
            }
            
            // 确保事件委托被正确绑定
            function ensureEventDelegation() {
                if (!usersTableBody) return;

                // 检查是否已经添加了事件监听器
                if (usersTableBody._hasEventDelegation) return;

                usersTableBody.addEventListener('click', function(e) {
                    const target = e.target.closest('button');
                    if (!target) return;

                    if (target.classList.contains('edit-user-btn')) {
                        e.preventDefault();
                        const userId = target.getAttribute('data-user-id');
                        const userEmail = target.getAttribute('data-user-email');
                        const userRole = target.getAttribute('data-user-role');
                        editUser(userId, userEmail, userRole);
                    } else if (target.classList.contains('delete-user-btn')) {
                        e.preventDefault();
                        const userId = target.getAttribute('data-user-id');
                        deleteUser(userId);
                    }
                });

                usersTableBody._hasEventDelegation = true;
            }

            // Make loadUsers available globally for pagination
            window.loadUsers = loadUsers;
        })();
    </script>
</div>
