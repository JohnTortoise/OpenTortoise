<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="px-4 py-6 sm:px-0">
        <!-- Page Header -->
        <div class="chat-config-header relative">
            <div class="relative z-10">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <h1 class="text-3xl font-bold mb-2 flex items-center gap-3">
                            <i class="fas fa-comments text-2xl"></i>
                            聊天配置管理
                        </h1>
                        <p class="text-green-100">管理和配置您的AI聊天会话</p>
                    </div>
                    <button onclick="openAddModalToChatProfile()" 
                            class="mt-4 sm:mt-0 btn-primary px-6 py-3 rounded-lg text-white font-medium shadow-lg">
                        <i class="fas fa-plus mr-2"></i>
                        新增配置
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Search Form -->
        <div class="config-card search-card p-6 mb-6">
            <h3 class="form-title">
                <i class="fas fa-search text-blue-600"></i>
                搜索配置
            </h3>
            <form id="profile-search-form" class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div>
                    <label for="profile-name-search" class="block text-sm font-semibold text-gray-700 mb-2">配置名称</label>
                    <input type="text" id="profile-name-search" name="name" 
                           class="input-modern w-full"
                           placeholder="请输入配置名称">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                            class="w-full btn-primary py-3 px-6 rounded-lg text-white font-medium shadow-lg">
                        <i class="fas fa-search mr-2"></i>搜索
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Profiles Table -->
        <div class="config-card table-modern">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">配置名称</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">模型配置ID</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">记忆策略ID</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">SK</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">创建时间</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">更新时间</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="profiles-table-body">
                        <!-- Data will be loaded here -->
                        <tr>
                            <td colspan="9" class="px-6 py-8 text-center">
                                <div class="empty-state">
                                    <div class="empty-state-icon">
                                        <i class="fas fa-spinner fa-spin"></i>
                                    </div>
                                    <p class="text-lg font-medium text-gray-600">加载中...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination Container -->
            <div id="profiles-pagination-container" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Profile Modal -->
    <div id="add-profile-modal" class="modal-modern hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="modal-content text-left overflow-hidden sm:max-w-2xl sm:w-full max-h-[90vh] flex flex-col">
                <!-- Scrollable Content Area -->
                <div class="flex-1 overflow-y-auto smooth-scroll">
                    <div class="px-6">
                        <!-- Modal Title -->
                    <form id="add-profile-form" class="space-y-6">
                        <input type="hidden" id="profile-id">
                        
                        <!-- Basic Information Section -->
                        <div class="form-section">
                            <div class="form-title">
                                <i class="fas fa-info-circle text-blue-600"></i>
                                基本信息
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label for="profile-name" class="block text-sm font-semibold text-gray-700 mb-2">
                                        配置名称 <span class="text-red-500">*</span>
                                    </label>
                                    <input type="text" id="profile-name" name="name" required
                                           class="input-modern w-full"
                                           placeholder="请输入配置名称">
                                </div>

                                <div>
                                    <label for="profile-status" class="block text-sm font-medium text-gray-700">状态</label>
                                    <select id="profile-status" name="status"
                                            class="input-modern w-full">
                                        <option value="1">启用</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Configuration Section -->
                        <div class="form-section">
                            <div class="form-title">
                                <i class="fas fa-cogs text-blue-600"></i>
                                关联配置
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label for="llm-config-input" class="block text-sm font-medium text-gray-700">
                                        模型配置 <span class="required-star">*</span>
                                    </label>
                                    <div class="relative mt-1">
                                        <input type="text" id="llm-config-input" 
                                               placeholder="输入配置名称搜索..." 
                                               class="input-modern w-full">
                                        <div id="chat-profile-llm-config-dropdown"
                                             class="absolute z-50 mt-1 w-full bg-white shadow-xl max-h-60 rounded-lg py-2 text-sm border border-gray-200 overflow-auto focus:outline-none hidden"
                                             style="box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);">
                                            <!-- 搜索结果将动态加载到这里 -->
                                        </div>
                                    </div>
                                    <input type="hidden" id="llm-config" name="llmConfigId" required>
                                </div>

                                <div>
                                    <label for="memory-policy-input" class="block text-sm font-medium text-gray-700">
                                        记忆策略 <span class="required-star">*</span>
                                    </label>
                                    <div class="relative mt-1">
                                        <input type="text" id="memory-policy-input" 
                                               placeholder="输入策略名称搜索..." 
                                               class="input-modern w-full">
                                        <div id="memory-policy-dropdown"
                                             class="absolute z-50 mt-1 w-full bg-white shadow-xl max-h-60 rounded-lg py-2 text-sm border border-gray-200 overflow-auto focus:outline-none hidden"
                                             style="box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);">
                                            <!-- 搜索结果将动态加载到这里 -->
                                        </div>
                                    </div>
                                    <input type="hidden" id="memory-policy" name="memoryPolicyId" required>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Token Limit Section -->
                        <div class="form-section">
                            <div class="form-title">
                                <i class="fas fa-tachometer-alt text-blue-600"></i>
                                Token限制配置
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label for="daily-token-limit-conversation" class="block text-sm font-semibold text-gray-700 mb-2">
                                        每个会话允许的单日token消耗数 <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="daily-token-limit-conversation" name="dailyTokenLimitConversation" 
                                           required min="0" step="1"
                                           class="input-modern w-full"
                                           placeholder="请输入每个会话的单日token限制">
                                </div>

                                <div>
                                    <label for="daily-token-limit-total" class="block text-sm font-semibold text-gray-700 mb-2">
                                        每个聊天配置允许的单日token消耗数 <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="daily-token-limit-total" name="dailyTokenLimitTotal" 
                                           required min="0" step="1"
                                           class="input-modern w-full"
                                           placeholder="请输入聊天配置的单日token限制">
                                </div>
                            </div>
                        </div>
                        </div>
                    </form>
                </div>

                <!-- Fixed Modal Footer -->
                <div class="bg-gray-50 px-6 py-4 sm:px-6 sm:flex sm:flex-row-reverse gap-3 flex-shrink-0 border-t border-gray-200">
                    <button type="button" id="save-profile-btn"
                            class="btn-primary px-6 py-3 rounded-lg text-white font-medium shadow-lg">
                        保存配置
                    </button>
                    <button type="button" onclick="closeAddProfileModal()"
                            class="px-6 py-3 rounded-lg border border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-50 transition">
                        <i class="fas fa-times mr-2"></i>
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // State management
            let currentSearch = {
                name: ''
            };
            let isPageActive = false;
            let currentPage = 1;
            const pageSize = 10;
            
            // DOM Elements
            const searchForm = document.getElementById('profile-search-form');
            const searchInput = document.getElementById('profile-name-search');
            const profilesTableBody = document.getElementById('profiles-table-body');
            const saveProfileBtn = document.getElementById('save-profile-btn');
            const profilesPaginationContainer = document.getElementById('profiles-pagination-container');

            // Event Listeners
            searchForm.addEventListener('submit', handleSearch);

            // 点击弹窗背景关闭弹窗
            const addProfileModal = document.getElementById('add-profile-modal');
            addProfileModal.addEventListener('click', function(e) {
                if (e.target === addProfileModal) {
                    closeAddProfileModal();
                }
            });

            // ESC键关闭弹窗
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !addProfileModal.classList.contains('hidden')) {
                    closeAddProfileModal();
                }
            });

            // Initialize page active state
            const chatProfilePage = document.getElementById('chat-profile-page');
            isPageActive = chatProfilePage ? chatProfilePage.classList.contains('active-page') : false;
            
            // 只监听按钮的click事件，避免与表单submit事件冲突
            saveProfileBtn.addEventListener("click",handleAddProfileSubmit)

            // 检查当前页面是否激活，如果激活则加载数据
            if (chatProfilePage && chatProfilePage.classList.contains('active-page')) {
                isPageActive = true;
                setTimeout(() => {
                    loadProfiles(1); // 加载第一页聊天配置
                }, 100);
            } else {
                // Chat-profile page is not active, waiting for pageChanged event
            }
            
            // Handle page changes
            document.addEventListener('pageChanged', function(e) {
                if (e.detail === 'chat-profile') {
                    // Only load if page wasn't already active
                    if (!isPageActive) {
                        isPageActive = true;
                        // 延迟加载，确保页面完全显示
                        setTimeout(() => {
                        loadProfiles(1); // 加载第一页聊天配置
                    }, 200);
                    }
                } else {
                    isPageActive = false;
                }
            });
            
            // 使用全局的showToast和hideToast函数（在layout.html中定义）
            
            function handleSearch(e) {
                e.preventDefault();
                currentSearch.name = document.getElementById('profile-name-search').value;
                currentPage = 1;
                loadProfiles(1); // 从第一页开始加载
            }
            
            function loadProfiles(page = 1) {
                const params = new URLSearchParams({
                    page: page,
                    size: pageSize,
                    name: currentSearch.name
                });
                
                authenticatedFetch(`/api/chatProfile/page?${params}`)
                    .then(response => {
                        return response.json();
                    })
                    .then(data => {
                        // 渲染表格
                          renderProfilesTable(data.records || []);
                          // 渲染分页
                          renderProfilesPagination({
                              current: page,
                              pages: data.pages || 1,
                              size: pageSize,
                              total: data.total || 0
                          });
                    })
                    .catch(error => {
                        profilesTableBody.innerHTML = `
                            <tr>
                                <td colspan="9" class="px-6 py-4 text-center text-sm text-red-500">
                                加载数据失败，请稍后重试
                            </td>
                            </tr>
                        `;
                    });
            }
            
            function renderProfilesPagination(pageData) {
                const { current = 1, pages = 1, size = 10, total = 0 } = pageData;
                const startItem = (current - 1) * size + 1;
                const endItem = Math.min(current * size, total);
                
                // 当没有数据时，显示第0到0条结果
                const displayStart = total > 0 ? startItem : 0;
                const displayEnd = total > 0 ? endItem : 0;
                
                let paginationHtml = `
                    <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6">
                        <div class="flex flex-1 justify-between sm:hidden">
                            <button id="profiles-mobile-prev-btn" class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 ${pages === 1 ? 'opacity-50 cursor-not-allowed' : ''}">
                                        上一页
                                    </button>
                                    <button id="profiles-mobile-next-btn" class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 ${pages === 1 ? 'opacity-50 cursor-not-allowed' : ''}">
                                        下一页
                                    </button>
                        </div>
                        <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                            <div>
                                <p class="text-sm text-gray-700">
                                    显示第 <span class="font-medium">${displayStart}</span> 到 <span class="font-medium">${displayEnd}</span> 条结果，共 <span class="font-medium">${total}</span> 条
                                </p>
                            </div>
                            <div class="flex items-center">
                                <div class="flex items-center">
                                    <span class="text-sm text-gray-700 mr-2">第</span>
                                    <input type="number" min="1" max="${pages}" value="${current}" 
                                           class="block w-16 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                                           id="profiles-page-input">
                                    <span class="text-sm text-gray-700 mx-2">页 / 共 ${pages} 页</span>
                                    <button id="profiles-page-go-btn" 
                                            class="ml-2 relative inline-flex items-center rounded-md border border-gray-300 bg-white px-3 py-1 text-sm font-medium text-gray-700 hover:bg-gray-50">
                                        跳转
                                    </button>
                                </div>
                                <div class="flex space-x-2 ml-4">
                                    <button id="profiles-prev-btn" class="relative inline-flex items-center rounded-l-md border border-gray-300 bg-white px-2 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50 ${current === 1 ? 'opacity-50 cursor-not-allowed' : ''}">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <button id="profiles-next-btn" class="relative inline-flex items-center rounded-r-md border border-gray-300 bg-white px-2 py-2 text-sm font-medium text-gray-500 hover:bg-gray-50 ${pages === 1 || current >= pages ? 'opacity-50 cursor-not-allowed' : ''}">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                  
                  profilesPaginationContainer.innerHTML = paginationHtml;
                
                // Add event listeners after rendering with a timeout to ensure DOM is fully updated
                setTimeout(() => {
                    // Previous page buttons
                    const prevBtn = document.getElementById('profiles-prev-btn');
                    const mobilePrevBtn = document.getElementById('profiles-mobile-prev-btn');
                    
                    // Next page buttons
                    const nextBtn = document.getElementById('profiles-next-btn');
                    const mobileNextBtn = document.getElementById('profiles-mobile-next-btn');
                    
                    // Page input and go button
                    const pageInput = document.getElementById('profiles-page-input');
                    const pageGoBtn = document.getElementById('profiles-page-go-btn');
                    
                    // Disable/enable buttons based on current page
                    if (current <= 1 || pages === 1) {
                        if (prevBtn) {
                            prevBtn.disabled = true;
                            prevBtn.classList.add('cursor-not-allowed', 'opacity-50');
                        }
                        if (mobilePrevBtn) {
                            mobilePrevBtn.disabled = true;
                            mobilePrevBtn.classList.add('cursor-not-allowed', 'opacity-50');
                        }
                    } else {
                        if (prevBtn) {
                            prevBtn.disabled = false;
                            prevBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                            prevBtn.onclick = () => {
                                loadProfiles(current - 1);
                            };
                        }
                        if (mobilePrevBtn) {
                            mobilePrevBtn.disabled = false;
                            mobilePrevBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                            mobilePrevBtn.onclick = () => {
                                loadProfiles(current - 1);
                            };
                        }
                    }
                    
                    if (current >= pages || pages === 1) {
                        if (nextBtn) {
                            nextBtn.disabled = true;
                            nextBtn.classList.add('cursor-not-allowed', 'opacity-50');
                        }
                        if (mobileNextBtn) {
                            mobileNextBtn.disabled = true;
                            mobileNextBtn.classList.add('cursor-not-allowed', 'opacity-50');
                        }
                    } else {
                        if (nextBtn) {
                            nextBtn.disabled = false;
                            nextBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                            nextBtn.onclick = () => {
                                loadProfiles(current + 1);
                            };
                        }
                        if (mobileNextBtn) {
                            mobileNextBtn.disabled = false;
                            mobileNextBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                            mobileNextBtn.onclick = () => {
                                loadProfiles(current + 1);
                            };
                        }
                    }
                    
                    // Page input and go button
                    if (pageInput && pageGoBtn) {
                        pageGoBtn.onclick = () => {
                            const pageNum = parseInt(pageInput.value);
                            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= pages) {
                                loadProfiles(pageNum);
                            } else {
                                showToast('请输入有效的页码', false);
                            }
                        };
                        
                        // Allow pressing Enter to go to the page
                        pageInput.addEventListener('keypress', (e) => {
                            if (e.key === 'Enter') {
                                pageGoBtn.click();
                            }
                        });
                    }
                }, 0);
                
            }
            
            function renderProfilesTable(profiles) {
                if (!profiles || profiles.length === 0) {
                    profilesTableBody.innerHTML = `
                        <tr>
                            <td colspan="9" class="px-6 py-4 text-center text-sm text-gray-500">
                                暂无数据
                            </td>
                        </tr>
                    `;
                } else {
                
                    profilesTableBody.innerHTML = profiles.map(profile => `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.id || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${profile.name || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.llmConfigId || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.memoryPolicyId || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.sk || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${profile.status == 1 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                    ${profile.status == 1 ? '启用' : '禁用'}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.createTime || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${profile.updateTime || ''}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button onclick="editProfile(${profile.id})" class="text-blue-600 hover:text-blue-900">
                                    <i class="fas fa-edit"></i> 编辑
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            }
            
            function refreshPage() {
                loadProfiles();
            }
            
            function openAddModalToChatProfile(isAdd = true) {
                setupSearchInputs();
                // 防止背景滚动
                document.body.style.overflow = 'hidden';

                // 只有在新增时才重置profile-id字段
                if (isAdd) {
                    document.getElementById('profile-id').value = '';
                }

                const modal = document.getElementById('add-profile-modal');
                modal.classList.remove('hidden');
                // 使用requestAnimationFrame确保DOM更新后再添加active类
                requestAnimationFrame(() => {
                    modal.classList.add('active');
                });
            }
            
            function closeAddProfileModal() {
                const modal = document.getElementById('add-profile-modal');
                modal.classList.remove('active');
                // 等待动画完成后隐藏弹窗
                setTimeout(() => {
                    modal.classList.add('hidden');
                    // 恢复背景滚动
                    document.body.style.overflow = '';

                    // 重置表单和隐藏字段
                    document.getElementById('add-profile-form').reset();
                    document.getElementById('profile-id').value = ''; // 确保profile-id也被重置
                    hideDropdown(document.getElementById('chat-profile-llm-config-dropdown'));
                    hideDropdown(document.getElementById('memory-policy-dropdown'));
                    document.getElementById('llm-config').value = '';
                    document.getElementById('memory-policy').value = '';
                    document.getElementById('daily-token-limit-conversation').value = '';
                    document.getElementById('daily-token-limit-total').value = '';
                }, 300); // 与CSS transition时间匹配
            }
            
            function hideDropdown(dropdown) {
                if (dropdown) {
                    dropdown.style.opacity = '0';
                    dropdown.style.transform = 'translateY(-5px)';
                    setTimeout(() => {
                        dropdown.style.display = 'none';
                        dropdown.style.visibility = 'hidden';
                    }, 200);
                }
            }
            
            function setupSearchInputs() {
                // 模型配置搜索 - 添加调试日志
                const llmInput = document.getElementById('llm-config-input');
                const llmDropdown = document.getElementById('chat-profile-llm-config-dropdown');
                const llmHidden = document.getElementById('llm-config');

                // 输入框点击时触发搜索，传入空字符串
                llmInput.onclick = function() {
                    llmHidden.value = '';
                    searchModels('');
                };

                llmInput.oninput = function() {
                    const keyword = this.value.trim();
                    llmHidden.value = '';
                    
                    if (keyword.length > 0) {
                        setTimeout(() => searchModels(keyword), 300);
                    } else {
                        // 输入清空时关闭下拉菜单
                        hideDropdown(llmDropdown);
                    }
                };
                
                // 记忆策略搜索
                const policyInput = document.getElementById('memory-policy-input');
                const policyDropdown = document.getElementById('memory-policy-dropdown');
                const policyHidden = document.getElementById('memory-policy');
                
                // 输入框点击时触发搜索，传入空字符串
                policyInput.onclick = function() {
                    policyHidden.value = '';
                    searchPolicies('');
                };
                
                policyInput.oninput = function() {
                    const keyword = this.value.trim();
                    policyHidden.value = '';
                    
                    if (keyword.length > 0) {
                        setTimeout(() => searchPolicies(keyword), 300);
                    } else {
                        // 输入清空时关闭下拉菜单
                        hideDropdown(policyDropdown);
                    }
                };
                
                // 点击其他地方关闭下拉
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('#llm-config-input') && !e.target.closest('#chat-profile-llm-config-dropdown')) {
                        hideDropdown(llmDropdown);
                    }
                    if (!e.target.closest('#memory-policy-input') && !e.target.closest('#memory-policy-dropdown')) {
                        hideDropdown(policyDropdown);
                    }
                });
            }
            
            function searchModels(keyword) {
                const dropdown = document.getElementById('chat-profile-llm-config-dropdown');
                dropdown.innerHTML = '<div class="search-dropdown-item cursor-default text-gray-500">搜索中...</div>';
                
                // 显示下拉菜单并添加动画
                dropdown.style.display = 'block';
                dropdown.style.visibility = 'visible';
                
                // 使用requestAnimationFrame确保DOM更新后再应用动画
                requestAnimationFrame(() => {
                    dropdown.style.opacity = '1';
                    dropdown.style.transform = 'translateY(0)';
                });
                
                authenticatedFetch(`/api/chatProfile/searchModel?keyword=${encodeURIComponent(keyword)}`)
                    .then(response => response.json())
                    .then(data => {
                        renderOptions(data, dropdown, 'llm-config-input', 'llm-config');
                    })
                    .catch(error => {
                        dropdown.innerHTML = '<div class="search-dropdown-item cursor-default text-red-500">搜索失败</div>';
                    });
            }
            
            function searchPolicies(keyword) {
                const dropdown = document.getElementById('memory-policy-dropdown');
                dropdown.innerHTML = '<div class="search-dropdown-item cursor-default text-gray-500">搜索中...</div>';
                
                // 显示下拉菜单并添加动画
                dropdown.style.display = 'block';
                dropdown.style.visibility = 'visible';
                
                // 使用requestAnimationFrame确保DOM更新后再应用动画
                requestAnimationFrame(() => {
                    dropdown.style.opacity = '1';
                    dropdown.style.transform = 'translateY(0)';
                });
                
                authenticatedFetch(`/api/chatProfile/searchMemoryPolicy?keyword=${encodeURIComponent(keyword)}`)
                    .then(response => response.json())
                    .then(data => {
                        renderOptions(data, dropdown, 'memory-policy-input', 'memory-policy');
                    })
                    .catch(error => {
                        dropdown.innerHTML = '<div class="search-dropdown-item cursor-default text-red-500">搜索失败</div>';
                    });
            }
            
            function renderOptions(items, dropdown, inputId, hiddenId) {
                const input = document.getElementById(inputId);
                const hidden = document.getElementById(hiddenId);

                if (!items || items.length === 0) {
                    dropdown.innerHTML = '<div class="search-dropdown-item cursor-default text-gray-500">暂无数据</div>';
                    dropdown.style.display = 'block';
                    dropdown.style.visibility = 'visible';

                    // 确保下拉菜单正确显示
                    setTimeout(() => {
                        dropdown.style.opacity = '1';
                        dropdown.style.transform = 'translateY(0)';
                    }, 10);
                    return;
                }

                dropdown.innerHTML = '';
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-dropdown-item';

                    let text = '';
                    if (inputId.includes('llm')) {
                        text = `${item.configName || item.modelName || ''} (ID: ${item.id})`;
                    } else {
                        text = `${item.name || ''} (ID: ${item.id})`;
                    }

                    div.textContent = text;
                    div.onclick = () => {
                        input.value = text;
                        hidden.value = item.id;
                        dropdown.style.display = 'none';
                        dropdown.style.visibility = 'hidden';
                    };

                    dropdown.appendChild(div);
                });

                dropdown.style.display = 'block';
                dropdown.style.visibility = 'visible';

                // 强制重新计算样式和位置
                dropdown.style.opacity = '1';
                dropdown.style.transform = 'translateY(0)';
            }
            
            function handleAddProfileSubmit(e) {
                e.preventDefault();

                // 直接通过DOM元素获取表单数据，避免依赖e.target
                const profileData = {
                    id: document.getElementById('profile-id').value || null,
                    name: document.getElementById('profile-name').value,
                    llmConfigId: document.getElementById('llm-config').value ? parseInt(document.getElementById('llm-config').value) : null,
                    memoryPolicyId: document.getElementById('memory-policy').value ? parseInt(document.getElementById('memory-policy').value) : null,
                    status: parseInt(document.getElementById('profile-status').value),
                    dailyTokenLimitConversation: document.getElementById('daily-token-limit-conversation').value ? parseInt(document.getElementById('daily-token-limit-conversation').value) : null,
                    dailyTokenLimitTotal: document.getElementById('daily-token-limit-total').value ? parseInt(document.getElementById('daily-token-limit-total').value) : null
                };
                
                // 如果ID为空，则删除该字段
                if (profileData.id === null || profileData.id === "") {
                    delete profileData.id;
                }

                // 验证必填字段
                if (!profileData.name) {
                    showToast('请填写配置名称', false);
                    return;
                }
                
                if (!profileData.llmConfigId) {
                    showToast('请选择模型配置', false);
                    return;
                }
                
                if (!profileData.memoryPolicyId) {
                    showToast('请选择记忆策略', false);
                    return;
                }
                
                if (profileData.dailyTokenLimitConversation === null || profileData.dailyTokenLimitConversation === undefined || profileData.dailyTokenLimitConversation < 0) {
                    showToast('请填写每个会话允许的单日token消耗数', false);
                    return;
                }
                
                if (profileData.dailyTokenLimitTotal === null || profileData.dailyTokenLimitTotal === undefined || profileData.dailyTokenLimitTotal < 0) {
                    showToast('请填写每个聊天配置允许的单日token消耗数', false);
                    return;
                }

                authenticatedFetch('/api/chatProfile/addOrUpdate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profileData)
                })
                .then(response => {
                    if (response.ok) {
                        // 先关闭弹窗
                        const modal = document.getElementById('add-profile-modal');
                        modal.classList.remove('active');
                        setTimeout(() => {
                            modal.classList.add('hidden');
                            // 恢复背景滚动
                            document.body.style.overflow = '';
                            // 重置表单
                            document.getElementById('add-profile-form').reset();
                            hideDropdown(document.getElementById('chat-profile-llm-config-dropdown'));
                            hideDropdown(document.getElementById('memory-policy-dropdown'));
                            document.getElementById('llm-config').value = '';
                            document.getElementById('memory-policy').value = '';
                            document.getElementById('daily-token-limit-conversation').value = '';
                            document.getElementById('daily-token-limit-total').value = '';

                            const isEdit = document.getElementById('profile-id').value;
                            showToast(isEdit ? '编辑聊天配置成功' : '新增聊天配置成功', true);
                            loadProfiles();
                        }, 300); // 与CSS transition时间匹配
                    } else {
                        return response.json().then(err => {
                            throw new Error(err.message || '新增失败');
                        });
                    }
                })
                .catch(error => {
                    showToast(error.message || '新增聊天配置失败', false);
                });
            }

            function editProfile(id) {
                // 获取配置详情
                authenticatedFetch(`/api/chatProfile/${id}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('获取配置详情失败');
                        }
                        return response.json();
                    })
                    .then(profile => {
                        // 填充表单数据
                        document.getElementById('profile-id').value = profile.id || '';
                        document.getElementById('profile-name').value = profile.name || '';
                        document.getElementById('profile-status').value = profile.status || 1;
                        document.getElementById('daily-token-limit-conversation').value = profile.dailyTokenLimitConversation || '';
                        document.getElementById('daily-token-limit-total').value = profile.dailyTokenLimitTotal || '';

                        // 设置模型配置和记忆策略
                        // 由于我们只有ID，需要根据ID获取名称，这里暂时设置ID，显示名称会在后续处理
                        document.getElementById('llm-config').value = profile.llmConfigId || '';
                        document.getElementById('memory-policy').value = profile.memoryPolicyId || '';

                        // 尝试获取模型配置名称
                        if (profile.llmConfigId) {
                            authenticatedFetch(`/api/llm-configs/${profile.llmConfigId}`)
                                .then(response => response.ok ? response.json() : null)
                                .then(config => {
                                    if (config) {
                                        document.getElementById('llm-config-input').value = `${config.configName || config.modelName || ''} (ID: ${config.id})`;
                                    }
                                })
                                .catch(error => console.log('获取模型配置名称失败:', error));
                        }

                        // 尝试获取记忆策略名称
                        if (profile.memoryPolicyId) {
                            authenticatedFetch(`/api/policy/detail?id=${profile.memoryPolicyId}`)
                                .then(response => response.ok ? response.json() : null)
                                .then(policy => {
                                    if (policy) {
                                        document.getElementById('memory-policy-input').value = `${policy.name || ''} (ID: ${policy.id})`;
                                    }
                                })
                                .catch(error => console.log('获取记忆策略名称失败:', error));
                        }

                        // 更新模态框标题
                        const modalTitle = document.querySelector('#add-profile-modal .modal-content h2');
                        if (modalTitle) {
                            modalTitle.textContent = '编辑聊天配置';
                        }

                        // 打开模态框（编辑模式）
                        openAddModalToChatProfile(false);
                    })
                    .catch(error => {
                        console.error('获取配置详情失败:', error);
                        showToast('获取配置详情失败', false);
                    });
            }

            // Make functions available globally for inline handlers
            window.loadProfiles = loadProfiles;
            window.editProfile = editProfile;
            window.openAddModalToChatProfile = openAddModalToChatProfile;
            window.closeAddProfileModal = closeAddProfileModal;
        });
    </script>
</div>
</html>
